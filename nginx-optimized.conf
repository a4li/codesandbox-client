# CodeSandbox 优化的 Nginx 配置
# 适用于自己部署的 unpkg 和 packager 服务

# 在 http 块中配置（如果是独立配置文件，需要包在 http {} 中）
# 如果是在 /etc/nginx/nginx.conf 中，这部分放在 http 块内
# 如果是在 sites-available 中，这部分放在 server 块外

# ============================================
# 第一部分：在 http 块中的全局配置
# ============================================

# upstream 配置 - 定义上游服务器池
upstream unpkg_backend {
    # 改为你的 unpkg 服务实际地址
    server 10.4.5.136:3001;  # 或者你的实际 IP:端口
    
    # 保持长连接，提升性能
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 100;
}

upstream packager_backend {
    # 改为你的 packager 服务实际地址
    server 10.4.5.136:3002;  # 或者你的实际 IP:端口
    
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 100;
}

# 缓存配置 - 大幅提升性能
proxy_cache_path /var/cache/nginx/unpkg 
    levels=1:2 
    keys_zone=unpkg_cache:100m 
    max_size=10g 
    inactive=7d 
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/packager 
    levels=1:2 
    keys_zone=packager_cache:100m 
    max_size=10g           # 增加缓存空间（packager 文件大）
    inactive=7d            # 增加缓存时间
    use_temp_path=off;

# 代理缓冲区全局设置（支持大文件）
proxy_buffering on;
proxy_buffers 16 128k;           # 增加缓冲区数量和大小
proxy_buffer_size 128k;          # 增加单个缓冲区大小
proxy_busy_buffers_size 256k;    # 增加繁忙缓冲区大小
proxy_max_temp_file_size 2048m;  # 允许最大 2GB 的临时文件
proxy_temp_file_write_size 128k;

# ============================================
# 第二部分：在 server 块中的配置
# ============================================

server {
    listen 80;
    listen [::]:80;
    
    # HTTP/2 配置（如果使用 HTTPS）
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # SSL 证书配置（如果使用 HTTPS，请取消注释并配置）
    # ssl_certificate /path/to/your/cert.pem;
    # ssl_certificate_key /path/to/your/key.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    
    server_name 10.4.5.136;  # 改为你的实际域名或 IP
    
    root /usr/share/nginx/html/www;  # 改为你的 www 目录路径
    index index.html;
    
    # 如果使用域名，添加 DNS 解析器（使用内网 DNS 或公共 DNS）
    # resolver 8.8.8.8 8.8.4.4 valid=300s ipv6=off;
    # resolver_timeout 5s;
    
    # HTTP/2 推送配置（可选，用于预加载关键资源）
    # http2_push_preload on;
    
    # 全局代理设置
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    
    # HTTP/2 相关优化
    http2_max_field_size 16k;
    http2_max_header_size 32k;
    
    # 如果客户端使用 HTTP/2，添加标识
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # ============================================
    # unpkg 服务代理 - 优化版
    # ============================================
    location /unpkg/ {
        # 移除 /unpkg 前缀
        rewrite ^/unpkg/(.*)$ /$1 break;
        
        # 使用 upstream
        proxy_pass http://unpkg_backend;
        
        # 基础代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # HTTP 1.1 和保持连接（关键优化）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 超时设置（根据实际情况调整）
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # 缓冲区设置（提升性能）
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # 启用缓存（重要！）
        proxy_cache unpkg_cache;
        proxy_cache_valid 200 304 7d;  # 成功响应缓存 7 天
        proxy_cache_valid 404 1m;      # 404 缓存 1 分钟
        proxy_cache_valid any 1h;      # 其他响应缓存 1 小时
        
        # 缓存键
        proxy_cache_key "$scheme$request_method$host$request_uri";
        
        # 在响应头中显示缓存状态（用于调试）
        add_header X-Cache-Status $upstream_cache_status;
        
        # 缓存锁定（防止缓存击穿）
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        
        # 允许使用陈旧的缓存（当上游服务不可用时）
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        
        # CORS 头
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        
        # 处理 OPTIONS 请求（预检）
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }
    
    # ============================================
    # packager 服务代理 - 优化版（大文件优化）
    # ============================================
    location /packager2/ {
        rewrite ^/packager2/(.*)$ /$1 break;
        
        proxy_pass http://packager_backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # HTTP 1.1 和保持连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 超时设置（packager 可能需要更长时间）
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # 大文件缓冲区设置（重要！）
        proxy_buffering on;
        proxy_buffer_size 128k;         # 增大以支持大文件
        proxy_buffers 16 128k;          # 更多缓冲区
        proxy_busy_buffers_size 256k;   # 更大的繁忙缓冲区
        
        # 启用缓存（大文件优化）
        proxy_cache packager_cache;
        proxy_cache_valid 200 304 7d;   # 成功响应缓存 7 天
        proxy_cache_valid 404 1m;
        proxy_cache_valid any 1h;
        
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
        
        # 缓存锁定（防止缓存击穿）
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;   # 大文件需要更长锁定时间
        
        # 允许使用陈旧的缓存（当上游服务不可用时）
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        
        # 大文件特殊设置
        client_max_body_size 100m;      # 允许上传大文件
        
        # CORS 头
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }
    
    # ============================================
    # 静态资源优化
    # ============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # ============================================
    # SPA 路由支持
    # ============================================
    location / {
        try_files $uri $uri/ /index.html?$query_string;
    }
}

